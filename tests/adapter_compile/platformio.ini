[platformio]
default_envs = esp32
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  https://github.com/Astonikum/display-lib.git#v0.7.0
  https://github.com/Astonikum/adapter-common-lib.git#v0.2.0
  https://github.com/Astonikum/ssd1306-lib.git#v0.3.1
  https://github.com/Astonikum/ili9341-lib.git#v0.2.1
  https://github.com/Astonikum/u8g2-lib.git#v0.2.1
  https://github.com/Astonikum/ssd1327-lib.git#v0.2.1
  https://github.com/Astonikum/arduino-gfx-lib.git#v0.2.1
  https://github.com/Astonikum/epaper-lib.git#v0.2.1
  moononournation/GFX Library for Arduino @ 1.6.9
  olikraus/U8g2 @ ^2.36.0
  adafruit/Adafruit SSD1327 @ ^1.0.4
  zinggjm/GxEPD2 @ 1.6.9
  adafruit/Adafruit GFX Library @ ^1.12.0
  adafruit/Adafruit BusIO @ ^1.17.0
build_flags = -Wall

lib_ldf_mode = deep+
